# Configuration Upptime pour la page de statut publique status.alcinae.com.
#
# Source de vérité : ce fichier vit dans le dépôt privé alcinae/alcinae
# (infra/platform/status-page/.upptimerc.yml). Une copie identique est
# recopiée vers le dépôt public alcinae/status après relecture (voir le
# README.md de ce dossier pour la procédure de copie). Ne jamais modifier
# la copie du dépôt public directement.
#
# Clés vérifiées sur la documentation officielle Upptime le 2026-09-16
# (https://upptime.js.org/docs/configuration, code source
# https://github.com/upptime/upptime.js.org/blob/master/docs/configuration.md
# et https://github.com/upptime/status-page/blob/master/i18n.yml), jamais
# devinées.

owner: alcinae
repo: status
user-agent: alcinae

# Couleurs du graphique Chart.js de la page de détail (Graph.svelte), clés
# racine (pas sous status-website), défaut sarcelle #89e0cf/#1abc9c sinon.
# Couleur unique (pas de variante sombre possible, valeur figée au build,
# pas réactive à prefers-color-scheme) : rust semi-transparent, lisible
# aussi bien sur une carte claire que sur une carte navy sombre.
graphBorderColor: "#b84a25"
graphBackgroundColor: "rgba(184, 74, 37, 0.18)"

# Allowlist stricte des secrets utilisables par les sondes et notifications
# (recommandation de la doc officielle, section "Secret allowlist") : sans
# cette liste, Upptime tolère toute variable $NOM présente dans une URL, un
# en-tête ou un corps de requête. GH_PAT n'y figure jamais : les workflows
# générés le reçoivent séparément.
secrets:
  - SECRET_FRANCEAPPRO_API_URL
  - SECRET_MEDIA_URL

# Ce `schedule` n'est plus le déclencheur réel depuis le 2026-09-16 : il ne
# se déclenchait jamais en pratique (limite connue d'Upptime, voir
# MONITORING-EXTERNE.md section 4). La fréquence réelle de 5 minutes vient
# d'un appel externe cron-job.org vers `repository_dispatch` (type `uptime`,
# voir uptime.yml). Ce `schedule` reste en place comme filet de secours
# partiel, sans effet indésirable s'il se déclenche en plus (concurrency
# sans cancel-in-progress dans uptime.yml).
workflowSchedule:
  uptime: "*/15 * * * *"

# 9 sondes, MONITORING-EXTERNE.md section 4. Toutes portent le même
# User-Agent explicite pour passer le filtre anti-bot nginx
# (infra/apps/nginx/sites/00-rate-limit.conf, map $http_user_agent $bad_bot) :
# ce User-Agent commence par "Mozilla/5.0 (compatible; ...)", il ne
# correspond à aucun des motifs bloqués (python-httpx, python-requests,
# curl/, wget/, masscan, zgrab, nuclei, sqlmap, nikto, dirbuster, gobuster,
# wfuzz, nmap, scrapy, libwww-perl, go-http-client) et n'est jamais une
# chaîne vide. Vérifié par lecture du fichier, aucun doute à signaler.
sites:
  - name: Site Alcinae
    slug: site-alcinae
    url: https://alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Alcinae"

  - name: Site La Ferme de Fontbonne
    slug: site-la-ferme-de-fontbonne
    url: https://fermedefontbonne.fr/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Fontbonne"

  - name: Challenge
    slug: challenge
    url: https://challenge.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

  - name: PingScore
    slug: pingscore
    url: https://pingscore.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

  - name: Boutique en ligne
    slug: boutique-en-ligne
    url: https://franceappro.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "France Appro"

  # URL masquée par secret : voir le compte rendu de l'agent pour la valeur
  # exacte proposée (route publique de lecture du catalogue franceappro,
  # sans authentification, sans effet de bord). Jamais écrite en clair ici.
  - name: Boutique en ligne (API)
    slug: boutique-en-ligne-api
    url: $SECRET_FRANCEAPPRO_API_URL
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

  - name: Forms
    slug: forms
    url: https://forms.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Alcinae Forms"

  - name: Authentification
    slug: authentification
    url: https://auth.alcinae.com/realms/alcinae/.well-known/openid-configuration
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "issuer"

  # URL masquée par secret : objet public de référence sous
  # media.alcinae.com. Voir le compte rendu de l'agent, aucune valeur stable
  # n'a pu être identifiée par analyse statique du dépôt (le contenu du
  # bucket est une donnée de production dynamique, pas un fichier versionné).
  - name: Médias
    slug: medias
    url: $SECRET_MEDIA_URL
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

# Utilisateurs GitHub assignés à chaque issue d'incident (décision de
# l'utilisateur, laissée en commentaire à compléter).
# assignees:
#   - <identifiant-github-a-completer>

status-website:
  cname: status.alcinae.com
  name: "Alcinae : état des services"

  # Thème calé sur le site principal (infra/apps/alcinae/assets/style.css :
  # --navy #14145C, --rust #B84A25), variables et règles dans
  # alcinae-status-theme.css (assets/) : mécanisme officiel vérifié dans
  # upptime/status-page src/routes/_layout.svelte le 2026-09-16
  # (status-website.links ajoute un <link> après les feuilles de thème,
  # donc nos règles gagnent en cascade). PAS de `theme:` explicite ici :
  # ça désactiverait le basculement automatique prefers-color-scheme
  # d'Upptime (constaté en régression le 2026-09-16, corrigé en laissant
  # Upptime charger light.css/dark.css selon le système, et en fournissant
  # nous-mêmes une palette claire ET sombre dans alcinae-status-theme.css
  # via @media (prefers-color-scheme: dark)).
  # URL ABSOLUE obligatoire (pas un chemin relatif) : constaté en échec de
  # Setup CI le 2026-09-16, le crawler d'export statique de Sapper suit tout
  # <link> à chemin relatif comme une page interne à exporter, entre en
  # collision avec la copie du fichier réel (EISDIR) une fois qu'il a créé
  # un dossier du même nom suite au 404 obtenu en local. L'exemple officiel
  # de la doc Upptime utilise déjà une URL absolue, pour cette raison.
  links:
    - rel: stylesheet
      href: https://status.alcinae.com/alcinae-status-theme.css

  # Logo repris tel quel du site principal, pas de duplication d'asset.
  # Pas de logoHref explicite : Nav.svelte retombe alors sur `config.path`
  # (la racine de status.alcinae.com elle-même), pour que le logo agisse
  # comme un lien "accueil" du statut, pas comme une sortie vers
  # alcinae.com (constaté le 2026-09-16 : le visiteur ne doit pas quitter
  # la page de statut en cliquant le logo). Le retour vers alcinae.com
  # reste disponible via le lien texte d'introMessage ci-dessous.
  logoUrl: https://alcinae.com/assets/alcinae.png
  favicon: https://alcinae.com/assets/alcinae.png
  navbarGitHub: false

  # introTitle ajouté le 2026-09-16 : la page d'accueil n'avait aucun <h1>
  # visible (seul un <h2> "État en direct" existait), défaut de hiérarchie
  # de titres constaté en revue UI/UX.
  introTitle: "État des services Alcinae"
  introMessage: >-
    Suivi en temps réel de la disponibilité des services Alcinae. Retour au
    site principal : [alcinae.com](https://alcinae.com).

  # Sur la page de détail d'un service (route history/[number]), le titre
  # est un <a href="URL réelle du service"> câblé en dur dans le composant
  # Summary.svelte du template upptime/status-page (vérifié le 2026-09-16,
  # aucune option de config ne le désactive). On ne veut pas que la page de
  # statut fasse sortir un visiteur vers un module interne. Un
  # MutationObserver est nécessaire : cet <a> n'existe pas au chargement, il
  # n'apparaît qu'après le fetch asynchrone de history/summary.json fait par
  # Summary.svelte. Retirer `href` suffit à rendre l'élément non navigable,
  # y compris au clavier (un <a> sans `href` n'est plus focusable).
  js: |
    (function () {
      function neutralize(a) {
        a.removeAttribute("href");
        a.removeAttribute("target");
        a.style.cursor = "default";
      }
      function scan() {
        document
          .querySelectorAll("main h1 a.no-underline[href]")
          .forEach(neutralize);
      }
      document.addEventListener("DOMContentLoaded", function () {
        new MutationObserver(scan).observe(document.body, {
          childList: true,
          subtree: true,
        });
        scan();
      });
    })();

