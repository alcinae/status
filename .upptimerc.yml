# Configuration Upptime pour la page de statut publique status.alcinae.com.
#
# Source de vérité : ce fichier vit dans le dépôt privé alcinae/alcinae
# (infra/platform/status-page/.upptimerc.yml). Une copie identique est
# recopiée vers le dépôt public alcinae/status après relecture (voir le
# README.md de ce dossier pour la procédure de copie). Ne jamais modifier
# la copie du dépôt public directement.
#
# Clés vérifiées sur la documentation officielle Upptime le 2026-09-16
# (https://upptime.js.org/docs/configuration, code source
# https://github.com/upptime/upptime.js.org/blob/master/docs/configuration.md
# et https://github.com/upptime/status-page/blob/master/i18n.yml), jamais
# devinées.

owner: alcinae
repo: status
user-agent: alcinae

# Allowlist stricte des secrets utilisables par les sondes et notifications
# (recommandation de la doc officielle, section "Secret allowlist") : sans
# cette liste, Upptime tolère toute variable $NOM présente dans une URL, un
# en-tête ou un corps de requête. GH_PAT n'y figure jamais : les workflows
# générés le reçoivent séparément.
secrets:
  - SECRET_FRANCEAPPRO_API_URL
  - SECRET_MEDIA_URL

# Fréquence des sondes : 5 minutes, le minimum que GitHub Actions autorise
# pour un déclenchement planifié (décision retenue dans SPEC.md). C'est déjà
# la valeur par défaut d'Upptime (workflowSchedule.uptime: "*/5 * * * *"),
# reprise ici explicitement pour que l'intention reste lisible dans ce
# fichier même si le défaut amont venait à changer.
workflowSchedule:
  uptime: "*/5 * * * *"

# 9 sondes, MONITORING-EXTERNE.md section 4. Toutes portent le même
# User-Agent explicite pour passer le filtre anti-bot nginx
# (infra/apps/nginx/sites/00-rate-limit.conf, map $http_user_agent $bad_bot) :
# ce User-Agent commence par "Mozilla/5.0 (compatible; ...)", il ne
# correspond à aucun des motifs bloqués (python-httpx, python-requests,
# curl/, wget/, masscan, zgrab, nuclei, sqlmap, nikto, dirbuster, gobuster,
# wfuzz, nmap, scrapy, libwww-perl, go-http-client) et n'est jamais une
# chaîne vide. Vérifié par lecture du fichier, aucun doute à signaler.
sites:
  - name: Site Alcinae
    slug: site-alcinae
    url: https://alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Alcinae"

  - name: Site La Ferme de Fontbonne
    slug: site-la-ferme-de-fontbonne
    url: https://fermedefontbonne.fr/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Fontbonne"

  - name: Challenge
    slug: challenge
    url: https://challenge.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

  - name: PingScore
    slug: pingscore
    url: https://pingscore.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

  - name: Boutique en ligne
    slug: boutique-en-ligne
    url: https://franceappro.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "France Appro"

  # URL masquée par secret : voir le compte rendu de l'agent pour la valeur
  # exacte proposée (route publique de lecture du catalogue franceappro,
  # sans authentification, sans effet de bord). Jamais écrite en clair ici.
  - name: Boutique en ligne (API)
    slug: boutique-en-ligne-api
    url: $SECRET_FRANCEAPPRO_API_URL
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

  - name: Forms
    slug: forms
    url: https://forms.alcinae.com/
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "Alcinae Forms"

  - name: Authentification
    slug: authentification
    url: https://auth.alcinae.com/realms/alcinae/.well-known/openid-configuration
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "issuer"

  # URL masquée par secret : objet public de référence sous
  # media.alcinae.com. Voir le compte rendu de l'agent, aucune valeur stable
  # n'a pu être identifiée par analyse statique du dépôt (le contenu du
  # bucket est une donnée de production dynamique, pas un fichier versionné).
  - name: Médias
    slug: medias
    url: $SECRET_MEDIA_URL
    headers:
      - "User-Agent: Mozilla/5.0 (compatible; AlcinaeStatusBot/1.0; +https://status.alcinae.com/)"
    expectedStatusCodes:
      - 200

# Utilisateurs GitHub assignés à chaque issue d'incident (décision de
# l'utilisateur, laissée en commentaire à compléter).
# assignees:
#   - <identifiant-github-a-completer>

status-website:
  cname: status.alcinae.com
  name: "Alcinae : état des services"
  navbar:
    - title: Alcinae
      href: https://alcinae.com
  introMessage: >-
    Suivi en temps réel de la disponibilité des services Alcinae. Retour au
    site principal : [alcinae.com](https://alcinae.com).

